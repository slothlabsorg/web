[build]
  command = "npm run build"
  publish = "out"
[functions]
  directory = "netlify/functions"

# ── Edge functions ────────────────────────────────────────────────────────────
# stats-auth guards /stats and /stats/* with HTTP Basic Auth.
[[edge_functions]]
  function = "stats-auth"
  path = "/stats"
[[edge_functions]]
  function = "stats-auth"
  path = "/stats/"
[[edge_functions]]
  function = "stats-auth"
  path = "/stats/*"

# admin-auth guards the /admin CMS surface with HTTP Basic Auth.
[[edge_functions]]
  function = "admin-auth"
  path = "/admin"
[[edge_functions]]
  function = "admin-auth"
  path = "/admin/"
[[edge_functions]]
  function = "admin-auth"
  path = "/admin/*"

# ── News CMS save endpoint ────────────────────────────────────────────────────
# /admin/news posts here to commit JSON to GitHub. Function performs its own
# Basic auth check; the redirect just maps the public path to the function.
[[redirects]]
  from   = "/api/news/save"
  to     = "/.netlify/functions/news-save"
  status = 200
  force  = true

# ── Tauri in-app updater endpoints ────────────────────────────────────────────
# All apps route through /api/updater/:app/:target/:version → Netlify function.
# NOTE: CloudOrbit's tauri.conf.json must point to:
#   https://slothlabs.org/api/updater/cloudorbit/{{target}}/{{current_version}}
# The other 4 apps (WattsOrbit, DataOrbit, BastionOrbit, ProxyOrbit) use
# raw.githubusercontent.com/slothlabsorg/{app}/main/latest.json — no Netlify needed.
[[redirects]]
  from   = "/api/updater/cloudorbit/:target/*"
  to     = "/.netlify/functions/updater"
  status = 200
  force  = true

# Static export fallback — serve each route's own index.html, not the root
[[redirects]]
  from   = "/*"
  to     = "/:splat/index.html"
  status = 200
