[build]
  command = "npm run build"
  publish = "out"
[functions]
  directory = "netlify/functions"

# ── CORS for news feed ────────────────────────────────────────────────────────
# The Orbit apps (Tauri) fetch the news feed from tauri://localhost and
# tauri://[app-name] origins. Netlify doesn't serve CORS headers for static
# files by default, so we add them explicitly for the /news/* path.
[[headers]]
  for = "/news/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# ── Edge functions ────────────────────────────────────────────────────────────
# stats-auth guards /stats and /stats/* with HTTP Basic Auth.
[[edge_functions]]
  function = "stats-auth"
  path = "/stats"
[[edge_functions]]
  function = "stats-auth"
  path = "/stats/"
[[edge_functions]]
  function = "stats-auth"
  path = "/stats/*"

# admin-auth guards the /admin CMS surface with HTTP Basic Auth.
[[edge_functions]]
  function = "admin-auth"
  path = "/admin"
[[edge_functions]]
  function = "admin-auth"
  path = "/admin/"
[[edge_functions]]
  function = "admin-auth"
  path = "/admin/*"

# ── News CMS save endpoint ────────────────────────────────────────────────────
# /admin/news posts here to commit JSON to GitHub. Function performs its own
# Basic auth check; the redirect just maps the public path to the function.
[[redirects]]
  from   = "/api/news/save"
  to     = "/.netlify/functions/news-save"
  status = 200
  force  = true

# ── Latest-release lookup for product pages ───────────────────────────────────
# /api/releases/<slug> → Netlify function that returns the latest GitHub release
# (version, date, per-OS/arch asset URLs), token-authed and CDN-cached ~5 min.
[[redirects]]
  from   = "/api/releases/*"
  to     = "/.netlify/functions/releases"
  status = 200
  force  = true

# ── Tauri in-app updater endpoints ────────────────────────────────────────────
# All apps route through /api/updater/:app/:target/:version → Netlify function.
# NOTE: CloudOrbit's tauri.conf.json must point to:
#   https://slothlabs.org/api/updater/cloudorbit/{{target}}/{{current_version}}
# The other 4 apps (WattsOrbit, DataOrbit, BastionOrbit, ProxyOrbit) use
# raw.githubusercontent.com/slothlabsorg/{app}/main/latest.json — no Netlify needed.
[[redirects]]
  from   = "/api/updater/cloudorbit/:target/*"
  to     = "/.netlify/functions/updater"
  status = 200
  force  = true

# ── runtime-orbit install one-liners ─────────────────────────────────────────
# Short, memorable URLs the docs and README can print:
#   curl -fsSL https://slothlabs.org/install/runtime-orbit | sh
# 302 rather than a 200 proxy so the script is always whatever main has, and so
# curl -L resolves it without Netlify caching a stale copy. There's no Windows
# script: the binary is unix-only, and Windows installs inside a WSL2 distro.
[[redirects]]
  from   = "/install/runtime-orbit"
  to     = "https://raw.githubusercontent.com/slothlabsorg/runtime-orbit/main/dist/install.sh"
  status = 302
  force  = true

[[redirects]]
  from   = "/install/runtime-orbit.sh"
  to     = "https://raw.githubusercontent.com/slothlabsorg/runtime-orbit/main/dist/install.sh"
  status = 302
  force  = true

# ── container-orbit → runtime-orbit (renamed in 0.2) ─────────────────────────
# Permanent, because the old URLs are indexed and linked from the repo's history.
[[redirects]]
  from   = "/container-orbit"
  to     = "/runtime-orbit"
  status = 301
  force  = true

[[redirects]]
  from   = "/container-orbit/*"
  to     = "/runtime-orbit/:splat"
  status = 301
  force  = true

# Static export fallback — serve each route's own index.html, not the root
[[redirects]]
  from   = "/*"
  to     = "/:splat/index.html"
  status = 200
