name: Daily Release Download Report

# Runs every day at 15:00 UTC (≈ morning in Americas) and emails a summary of
# release download counts across all slothlabsorg product repos.
#
# Setup required (one-time):
#   Settings → Secrets and variables → Actions → New repository secret
#     MAIL_SMTP_SERVER   e.g. smtp.gmail.com
#     MAIL_SMTP_PORT     e.g. 465
#     MAIL_USERNAME      your sending email address
#     MAIL_PASSWORD      app-specific password (Gmail: generate at myaccount.google.com/apppasswords)
#     MAIL_TO            destination email (the one that should receive the report)
#
# For Gmail: enable 2FA then create an App Password — DO NOT use your actual password.

on:
  schedule:
    - cron: '0 15 * * *'   # 15:00 UTC daily
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Gather release stats
        id: stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPOS=(
            "slothlabsorg/mermaid-preview-plugin"
            "slothlabsorg/cloudorbit"
            "slothlabsorg/wattsorbit"
            "slothlabsorg/dataorbit"
            "slothlabsorg/proxyorbit"
            "slothlabsorg/bastionorbit"
          )

          OUT_HTML="$(mktemp)"
          OUT_TEXT="$(mktemp)"
          DATE_TODAY="$(date -u +'%Y-%m-%d')"

          {
            echo "<!DOCTYPE html><html><body style='font-family:-apple-system,Segoe UI,sans-serif;background:#f6f8fa;padding:24px;'>"
            echo "<div style='max-width:720px;margin:0 auto;background:#fff;border-radius:12px;padding:28px;border:1px solid #e1e4e8;'>"
            echo "<h2 style='margin:0 0 4px;color:#24292e;'>SlothLabs daily release report</h2>"
            echo "<p style='color:#6a737d;margin:0 0 20px;font-size:14px;'>UTC date: $DATE_TODAY</p>"
          } >> "$OUT_HTML"

          {
            echo "SlothLabs daily release report"
            echo "UTC date: $DATE_TODAY"
            echo ""
          } >> "$OUT_TEXT"

          TOTAL_DL=0

          for REPO in "${REPOS[@]}"; do
            echo "Checking $REPO..."

            # Fetch latest releases — skip repos with no releases
            JSON=$(gh api "repos/$REPO/releases?per_page=20" 2>/dev/null || echo "[]")
            COUNT=$(echo "$JSON" | jq 'length')

            REPO_SHORT="${REPO##*/}"

            {
              echo "<div style='margin-top:22px;padding:14px 16px;background:#fafbfc;border-radius:8px;border:1px solid #e1e4e8;'>"
              echo "<h3 style='margin:0 0 8px;color:#24292e;font-size:16px;'>"
              echo "<a href='https://github.com/$REPO/releases' style='color:#0366d6;text-decoration:none;'>$REPO_SHORT</a>"
              echo "</h3>"
            } >> "$OUT_HTML"

            echo "=== $REPO_SHORT ===" >> "$OUT_TEXT"

            if [ "$COUNT" = "0" ]; then
              echo "<p style='color:#6a737d;margin:0;font-size:13px;'>No releases yet.</p></div>" >> "$OUT_HTML"
              echo "(no releases yet)" >> "$OUT_TEXT"
              echo "" >> "$OUT_TEXT"
              continue
            fi

            REPO_TOTAL=$(echo "$JSON" | jq '[.[].assets[].download_count] | add // 0')
            TOTAL_DL=$((TOTAL_DL + REPO_TOTAL))

            {
              echo "<p style='margin:0 0 10px;color:#24292e;font-size:13px;'><strong>Total downloads across all assets:</strong> $REPO_TOTAL</p>"
              echo "<table style='width:100%;border-collapse:collapse;font-size:13px;'>"
              echo "<tr style='background:#f1f3f5;'><th style='text-align:left;padding:6px 8px;border-bottom:1px solid #e1e4e8;'>Version</th><th style='text-align:left;padding:6px 8px;border-bottom:1px solid #e1e4e8;'>Published</th><th style='text-align:left;padding:6px 8px;border-bottom:1px solid #e1e4e8;'>Asset</th><th style='text-align:right;padding:6px 8px;border-bottom:1px solid #e1e4e8;'>Downloads</th></tr>"
            } >> "$OUT_HTML"

            echo "Total downloads: $REPO_TOTAL" >> "$OUT_TEXT"

            # Iterate releases and their assets
            echo "$JSON" | jq -r '.[] | . as $r | .assets[]? | "\($r.tag_name)|\($r.published_at[:10])|\(.name)|\(.download_count)"' | while IFS='|' read -r TAG DATE ASSET DL; do
              {
                echo "<tr><td style='padding:5px 8px;border-bottom:1px solid #eee;color:#0366d6;'>$TAG</td><td style='padding:5px 8px;border-bottom:1px solid #eee;color:#6a737d;'>$DATE</td><td style='padding:5px 8px;border-bottom:1px solid #eee;color:#24292e;font-family:monospace;font-size:11px;'>$ASSET</td><td style='padding:5px 8px;border-bottom:1px solid #eee;text-align:right;font-weight:600;color:#22863a;'>$DL</td></tr>"
              } >> "$OUT_HTML"
              echo "  $TAG | $DATE | $ASSET | $DL downloads" >> "$OUT_TEXT"
            done

            echo "</table></div>" >> "$OUT_HTML"
            echo "" >> "$OUT_TEXT"
          done

          {
            echo "<div style='margin-top:24px;padding:14px 16px;background:#e6ffed;border-radius:8px;border:1px solid #bef5cb;'>"
            echo "<p style='margin:0;color:#22863a;font-size:14px;'><strong>🌿 Grand total downloads across all repos:</strong> $TOTAL_DL</p>"
            echo "</div>"
            echo "<p style='margin:18px 0 0;color:#6a737d;font-size:11px;text-align:center;'>Generated by .github/workflows/daily-release-report.yml · SlothLabs</p>"
            echo "</div></body></html>"
          } >> "$OUT_HTML"

          {
            echo "===================="
            echo "GRAND TOTAL: $TOTAL_DL downloads"
          } >> "$OUT_TEXT"

          echo "html_file=$OUT_HTML"         >> "$GITHUB_OUTPUT"
          echo "text_file=$OUT_TEXT"         >> "$GITHUB_OUTPUT"
          echo "total_downloads=$TOTAL_DL"   >> "$GITHUB_OUTPUT"
          echo "date=$DATE_TODAY"            >> "$GITHUB_OUTPUT"

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_SERVER }}
          server_port:    ${{ secrets.MAIL_SMTP_PORT }}
          secure:         true
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          from:           "SlothLabs Reports <${{ secrets.MAIL_USERNAME }}>"
          to:             ${{ secrets.MAIL_TO }}
          subject:        "SlothLabs daily release report — ${{ steps.stats.outputs.date }} · ${{ steps.stats.outputs.total_downloads }} total DLs"
          html_body:      file://${{ steps.stats.outputs.html_file }}
          body:           file://${{ steps.stats.outputs.text_file }}
